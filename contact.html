<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Adarsh</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body>
  <img class="image-gradient" src="gradient.png" alt="gradient" />
  <div class="layer-blur"></div>

  <div class="container">
    <header>
      <h1 data-aos="fade-down" data-aos-duration="1500" class="logo">ADARSH</h1>
      <nav>
        <a data-aos="fade-down" data-aos-duration="1500" href="projects.html">PROJECTS</a>
        <a data-aos="fade-down" data-aos-duration="2000" href="company.html">COMPANY</a>
        <a data-aos="fade-down" data-aos-duration="2500" href="education.html">EDUCATION</a>
        <a data-aos="fade-down" data-aos-duration="3000" href="contact.html">CONTACT</a>
      </nav>
      <button data-aos="fade-down" data-aos-duration="1500" class="btn-signin">SIGNING</button>
    </header>

    <main>
      <div class="content">
        <div class="tag-box" data-aos="fade-zoom-in" data-aos-duration="1500">
          <div class="tag">GET IN TOUCH</div>
        </div>

        <h1 data-aos="fade-up" data-aos-duration="2000">Contact Me</h1>

        <div class="description" data-aos="fade-up" data-aos-duration="2500">
          <p>Let's build something amazing together! Feel free to reach out via the form below or email me directly.</p>
        </div>

        <form data-aos="fade-up" data-aos-duration="3000" style="margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem; max-width: 30rem;">
          <input type="text" placeholder="Your Name" style="padding: 0.8rem; border-radius: 10px; border: none; background: #1a1a1a; color: white;">
          <input type="email" placeholder="Your Email" style="padding: 0.8rem; border-radius: 10px; border: none; background: #1a1a1a; color: white;">
          <textarea rows="5" placeholder="Your Message" style="padding: 0.8rem; border-radius: 10px; border: none; background: #1a1a1a; color: white;"></textarea>
          <button type="submit" class="btn-signin-main" style="width: fit-content;">Send &gt;</button>
        </form>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>AOS.init();</script>
</body>
</html>
